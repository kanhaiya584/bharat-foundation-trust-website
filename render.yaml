services:
  - type: web
    name: bharat-foundation-trust-api
    runtime: docker
    rootDir: php
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Bharat Foundation Trust"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: APP_URL
        value: https://bharat-foundation-trust-api.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_STATEFUL_DOMAINS
        value: bharat-foundation-trust-website.onrender.com
      - key: ADMIN_NAME
        value: "Trust Admin"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MAIL_MAILER
        value: log

  - type: web
    name: bharat-foundation-trust-website
    runtime: static
    rootDir: Angular
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/angular/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
